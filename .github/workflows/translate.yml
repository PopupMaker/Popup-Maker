name: AI Translate

on:
    # Auto-run on develop when translatable files change
    push:
        branches: [develop]
        paths:
            - '**/*.php'
            - '**/*.js'
            - '**/*.jsx'
            - '**/*.ts'
            - '**/*.tsx'
            - 'languages/*.pot'
    # Manual trigger for full control
    workflow_dispatch:
        inputs:
            languages:
                description: 'Target languages (empty uses repository default)'
                required: false
                default: ''
            max_cost:
                description: 'Maximum cost in USD'
                required: false
                default: ''
            max_strings_per_job:
                description: 'Maximum strings per language (empty means unlimited)'
                required: false
                default: ''
            model:
                description: 'OpenAI model'
                required: false
                default: ''
            dry_run:
                description: 'Dry run (no API calls)'
                required: false
                type: boolean
                default: false
            force_translate:
                description: 'Force re-translate all strings'
                required: false
                type: boolean
                default: false

env:
    PLUGIN_SLUG: popup-maker
    POTOMATIC_VERSION: '1.3.0'

permissions:
    contents: write
    pull-requests: write

concurrency:
    group: ai-translate-${{ github.repository }}
    cancel-in-progress: false

jobs:
    translate:
        # Automatic paid runs remain opt-in; manual dry-runs and translations
        # are always available through workflow_dispatch.
        if: github.event_name == 'workflow_dispatch' || vars.ENABLE_AUTO_TRANSLATION == 'true'
        name: AI Translate POT
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.1'
                  tools: wp-cli

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build assets
              run: pnpm run build

            - name: Create languages directory
              run: mkdir -p languages

            - name: Generate POT file
              run: |
                  wp i18n make-pot . languages/$PLUGIN_SLUG.pot \
                    --domain=$PLUGIN_SLUG \
                    --exclude=vendor,vendor-prefixed,node_modules,tests

            - name: Run AI Translation
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  TARGET_LANGUAGES: ${{ inputs.languages || vars.DEFAULT_TRANSLATION_LANGUAGES || 'es_ES,pt_BR,fr_FR,de_DE,ja,ru_RU,it_IT,nl_NL,pl_PL,tr_TR,id_ID,zh_CN,ar,sv_SE,ko_KR,vi,fa_IR,cs_CZ,pt_PT,hu_HU,es_MX,da_DK,zh_TW,he_IL,th,ro_RO,el,hi_IN' }}
                  MAX_COST: ${{ inputs.max_cost || vars.DEFAULT_TRANSLATION_MAX_COST || '2.00' }}
                  INPUT_MAX_STRINGS: ${{ inputs.max_strings_per_job || '' }}
                  MODEL: ${{ inputs.model || vars.DEFAULT_TRANSLATION_MODEL || 'gpt-5.4-mini' }}
                  DRY_RUN: ${{ inputs.dry_run || 'false' }}
                  FORCE_TRANSLATE: ${{ inputs.force_translate || 'false' }}
              run: |
                  if [[ "$DRY_RUN" != "true" && -z "$OPENAI_API_KEY" ]]; then
                    echo "::error::OPENAI_API_KEY is required for a paid translation run."
                    exit 1
                  fi

                  ARGS=(
                    --pot-file-path "languages/$PLUGIN_SLUG.pot"
                    --output-dir languages/
                    --po-file-prefix "$PLUGIN_SLUG-"
                    --locale-format wp_locale
                    --target-languages "$TARGET_LANGUAGES"
                    --max-cost "$MAX_COST"
                    --model "$MODEL"
                  )

                  if [[ "$DRY_RUN" == "true" ]]; then
                    ARGS+=( --dry-run )
                  fi

                  if [[ "$FORCE_TRANSLATE" == "true" ]]; then
                    ARGS+=( --force-translate )
                  fi

                  if [[ "$INPUT_MAX_STRINGS" =~ ^[1-9][0-9]*$ ]]; then
                    ARGS+=( --max-strings-per-job "$INPUT_MAX_STRINGS" )
                  fi

                  pnpm dlx "potomatic@$POTOMATIC_VERSION" "${ARGS[@]}"

            - name: Generate runtime translations
              if: inputs.dry_run != true
              run: |
                  if ls languages/*.po 1> /dev/null 2>&1; then
                    wp i18n make-mo languages/
                    wp i18n make-json languages/ --no-purge
                  fi

            - name: Check for changes
              id: changes
              run: |
                  if [[ -z "$(git status --porcelain -- languages/)" ]]; then
                    echo "changed=false" >> $GITHUB_OUTPUT
                  else
                    echo "changed=true" >> $GITHUB_OUTPUT
                  fi

            - name: Open translation pull request
              if: steps.changes.outputs.changed == 'true' && inputs.dry_run != true
              env:
                  GH_TOKEN: ${{ github.token }}
                  INPUT_LANGUAGES: ${{ inputs.languages || vars.DEFAULT_TRANSLATION_LANGUAGES || 'es_ES,pt_BR,fr_FR,de_DE,ja,ru_RU,it_IT,nl_NL,pl_PL,tr_TR,id_ID,zh_CN,ar,sv_SE,ko_KR,vi,fa_IR,cs_CZ,pt_PT,hu_HU,es_MX,da_DK,zh_TW,he_IL,th,ro_RO,el,hi_IN' }}
              run: |
                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  BRANCH="automation/i18n-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  git switch -c "$BRANCH"
                  git add languages/
                  git commit -m "chore(i18n): update translations for $INPUT_LANGUAGES"
                  git push --set-upstream origin "$BRANCH"
                  gh pr create \
                    --base develop \
                    --head "$BRANCH" \
                    --title "chore(i18n): update translations" \
                    --body "AI-generated translation update for: $INPUT_LANGUAGES. Review language quality before merging."
