# SHARED_TRANSLATION_INFRASTRUCTURE
# This workflow is temporarily duplicated across Popup Maker and Code Atlantic repositories.
# Propagate every behavioral change to all consumers until reusable shared actions replace it.

name: AI Translate
run-name: AI Translate (${{ github.event_name == 'push' && 'automatic' || inputs.dry_run && 'dry run' || 'paid manual' }})

on:
    # Translate immediately after translatable code lands on develop.
    push:
        branches: [develop]
        paths:
            - '**/*.php'
            - '**/*.js'
            - '**/*.jsx'
            - '**/*.ts'
            - '**/*.tsx'
            - '**/block.json'
            - 'languages/**'
    workflow_dispatch:
        inputs:
            languages:
                description: 'Languages to prime, comma-separated (empty uses all configured languages)'
                required: false
                default: ''
            dry_run:
                description: 'Dry run (no API calls)'
                required: false
                type: boolean
                default: true
            paid_confirmation:
                description: 'For a paid manual run, type TRANSLATE'
                required: false
                default: ''

env:
    PLUGIN_SLUG: popup-maker
    TRANSLATION_BASE_BRANCH: develop
    TARGET_LANGUAGES: es_ES,pt_BR,fr_FR,de_DE,ja,ru_RU,it_IT,nl_NL,pl_PL,tr_TR,id_ID,zh_CN,ar,sv_SE,ko_KR,vi,fa_IR,cs_CZ,pt_PT,hu_HU,es_MX,da_DK,zh_TW,he_IL,th,ro_RO,el,hi_IN
    EXPECTED_CATALOG_LOCALES: es_ES,pt_BR,fr_FR,de_DE,ja_JP,ru_RU,it_IT,nl_NL,pl_PL,tr_TR,id_ID,zh_CN,ar_AR,sv_SE,ko_KR,vi_VN,fa_IR,cs_CZ,pt_PT,hu_HU,es_MX,da_DK,zh_TW,he_IL,th_TH,ro_RO,el_GR,hi_IN
    EXPECTED_LANGUAGE_COUNT: '28'
    POTOMATIC_VERSION: '1.3.0'
    PAID_MODEL: gpt-5.4-mini
    MAX_PAID_COST: '1.25'
    MAX_PRIME_PAID_COST: '0.60'
    MAX_MANUAL_PAID_RUNS_PER_24_HOURS: '1'
    MAX_PRIME_PAID_RUNS_PER_24_HOURS: '2'
    MAX_MISSING_PER_LANGUAGE: '75'
    MAX_PRIME_MISSING_PER_LANGUAGE: '200'
    MAX_TOTAL_MISSING: '2100'
    MAX_STRINGS_PER_JOB: '75'
    MAX_PRIME_STRINGS_PER_JOB: '200'
    AUTOMATION_BRANCH: automation/i18n-develop
    BLOCKER_LABEL: translation-automation-blocked

permissions:
    actions: read
    contents: write
    issues: write
    pull-requests: write

concurrency:
    group: ai-translate-${{ github.repository }}
    cancel-in-progress: false

jobs:
    gate:
        name: Translation safety gate
        runs-on: ubuntu-latest
        outputs:
            should_run: ${{ steps.guard.outputs.should_run }}

        steps:
            - name: Enforce automatic and manual guardrails
              id: guard
              env:
                  GH_TOKEN: ${{ github.token }}
                  DRY_RUN: ${{ inputs.dry_run || 'false' }}
                  PAID_CONFIRMATION: ${{ inputs.paid_confirmation }}
                  PRIME_LANGUAGES: ${{ inputs.languages }}
              run: |
                  set -euo pipefail

                  echo "should_run=true" >> "$GITHUB_OUTPUT"

                  if [[ "$GITHUB_RUN_ATTEMPT" != "1" ]]; then
                    echo "::error::Translation workflow runs cannot be re-run. Start a new reviewed dispatch instead."
                    exit 1
                  fi

                  if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                    if ! CATALOG_COUNT=$(
                      gh api \
                        "repos/$GITHUB_REPOSITORY/contents/languages?ref=$TRANSLATION_BASE_BRANCH" \
                        --jq '[.[] | select(.type == "file" and (.name | endswith(".po")))] | length' \
                        2>/dev/null
                    ); then
                      CATALOG_COUNT=0
                    fi

                    if [[ ! "$CATALOG_COUNT" =~ ^[0-9]+$ ]]; then
                      echo "::error::Could not determine the current translation catalog count."
                      exit 1
                    fi

                    if (( CATALOG_COUNT != EXPECTED_LANGUAGE_COUNT )); then
                      echo "The initial $EXPECTED_LANGUAGE_COUNT-language catalog set requires a reviewed manual paid dispatch; skipping automatic translation."
                      echo "should_run=false" >> "$GITHUB_OUTPUT"
                      {
                        echo "### Translation bootstrap deferred"
                        echo "- Current catalogs: $CATALOG_COUNT/$EXPECTED_LANGUAGE_COUNT"
                        echo "- Start the first paid run manually with the required confirmation."
                      } >> "$GITHUB_STEP_SUMMARY"
                      exit 0
                    fi
                  fi

                  if [[ "$GITHUB_EVENT_NAME" == "push" || "$DRY_RUN" != "true" ]]; then
                    OPEN_PR_COUNT=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$AUTOMATION_BRANCH" --json number --jq 'length')
                    BLOCKER_COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label "$BLOCKER_LABEL" --json number --jq 'length')

                    if (( OPEN_PR_COUNT > 0 || BLOCKER_COUNT > 0 )); then
                      if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                        echo "An existing translation PR or blocker issue requires review; skipping automatic translation."
                        echo "should_run=false" >> "$GITHUB_OUTPUT"
                        exit 0
                      fi

                      echo "::error::Review the existing translation PR or blocker issue before starting another paid run."
                      exit 1
                    fi
                  fi

                  if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" && "$DRY_RUN" != "true" ]]; then
                    if [[ "$PAID_CONFIRMATION" != "TRANSLATE" ]]; then
                      echo "::error::Paid translation requires paid_confirmation=TRANSLATE."
                      exit 1
                    fi

                    CUTOFF=$(date -u -d '24 hours ago' '+%Y-%m-%dT%H:%M:%SZ')
                    RUN_LIMIT=$MAX_MANUAL_PAID_RUNS_PER_24_HOURS
                    if [[ -n "$PRIME_LANGUAGES" ]]; then
                      RUN_LIMIT=$MAX_PRIME_PAID_RUNS_PER_24_HOURS
                    fi
                    RECENT_RUNS=$(
                      gh api \
                        "repos/$GITHUB_REPOSITORY/actions/workflows/translate.yml/runs?event=workflow_dispatch&per_page=100" \
                      | jq \
                          --arg cutoff "$CUTOFF" \
                          --argjson current "$GITHUB_RUN_ID" \
                          '[.workflow_runs[] | select(.id != $current and .created_at >= $cutoff and .display_title == "AI Translate (paid manual)")] | length'
                    )

                    if (( RECENT_RUNS >= RUN_LIMIT )); then
                      echo "::error::Paid manual translation is limited to $RUN_LIMIT run(s) per rolling 24 hours for this mode."
                      exit 1
                    fi
                  fi

                  {
                    echo "### Translation guardrails"
                    echo "- Automatic cadence: immediately after translatable changes reach $TRANSLATION_BASE_BRANCH"
                    echo "- Hard estimated cost ceiling: \$$MAX_PAID_COST"
                    echo "- Maximum missing strings per language: $MAX_MISSING_PER_LANGUAGE"
                    echo "- Maximum missing translation units: $MAX_TOTAL_MISSING"
                    echo "- Manual prime ceiling: \$$MAX_PRIME_PAID_COST and $MAX_PRIME_MISSING_PER_LANGUAGE strings per language"
                    echo "- Re-runs: prohibited"
                  } >> "$GITHUB_STEP_SUMMARY"

    translate:
        name: AI Translate POT
        needs: gate
        if: needs.gate.outputs.should_run == 'true'
        runs-on: ubuntu-latest
        timeout-minutes: 45

        steps:
            - name: Checkout latest develop
              uses: actions/checkout@v7
              with:
                  ref: ${{ env.TRANSLATION_BASE_BRANCH }}
                  fetch-depth: 0

            - name: Setup pnpm
              uses: pnpm/action-setup@v5

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: '22'
                  cache: 'pnpm'

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.1'
                  tools: wp-cli

            - name: Install gettext
              run: sudo apt-get update && sudo apt-get install -y gettext

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Build assets
              run: pnpm run build

            - name: Generate POT file
              run: |
                  mkdir -p languages
                  wp i18n make-pot . languages/$PLUGIN_SLUG.pot \
                    --domain=$PLUGIN_SLUG \
                    --exclude=vendor,vendor-prefixed,node_modules,tests

            - name: Configure translation scope
              id: scope
              env:
                  REQUESTED_LANGUAGES: ${{ inputs.languages }}
              run: |
                  bash bin/configure-translation-scope.sh \
                    languages \
                    "$PLUGIN_SLUG" \
                    "$TARGET_LANGUAGES" \
                    "$EXPECTED_CATALOG_LOCALES" \
                    "$REQUESTED_LANGUAGES" \
                    >> "$GITHUB_OUTPUT"

                  if [[ -n "$REQUESTED_LANGUAGES" ]]; then
                    echo "max_missing_per_language=$MAX_PRIME_MISSING_PER_LANGUAGE" >> "$GITHUB_OUTPUT"
                    echo "max_paid_cost=$MAX_PRIME_PAID_COST" >> "$GITHUB_OUTPUT"
                    echo "max_strings_per_job=$MAX_PRIME_STRINGS_PER_JOB" >> "$GITHUB_OUTPUT"
                  else
                    echo "max_missing_per_language=$MAX_MISSING_PER_LANGUAGE" >> "$GITHUB_OUTPUT"
                    echo "max_paid_cost=$MAX_PAID_COST" >> "$GITHUB_OUTPUT"
                    echo "max_strings_per_job=$MAX_STRINGS_PER_JOB" >> "$GITHUB_OUTPUT"
                  fi

            - name: Merge POT and measure missing translations
              id: preflight
              run: |
                  bash bin/prepare-translation-catalogs.sh \
                    languages \
                    "${{ steps.scope.outputs.max_missing_per_language }}" \
                    "$MAX_TOTAL_MISSING" \
                    "${{ steps.scope.outputs.expected_language_count }}" \
                    "${{ steps.scope.outputs.expected_catalog_locales }}"

            - name: Enforce translation-size ceiling
              if: steps.preflight.outputs.within_limits != 'true'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
                    gh label create "$BLOCKER_LABEL" \
                      --color B60205 \
                      --description "Automatic translations are paused pending review" \
                      --force
                    gh issue create \
                      --title "Translation automation paused: catalog delta exceeds limits" \
                      --label "$BLOCKER_LABEL" \
                      --body "The automatic develop translation run found ${{ steps.preflight.outputs.total_missing }} missing units, with up to ${{ steps.preflight.outputs.max_missing }} in one language. It found ${{ steps.preflight.outputs.catalog_count }} expected catalogs, ${{ steps.preflight.outputs.missing_catalogs }} missing catalogs, and ${{ steps.preflight.outputs.unexpected_catalogs }} unexpected catalogs. The automatic limits are $MAX_TOTAL_MISSING total, $MAX_MISSING_PER_LANGUAGE per language, and the exact configured set of $EXPECTED_LANGUAGE_COUNT locales. Review the source delta and close this issue to resume automation."
                  fi

                  echo "::error::Translation catalog delta exceeds the automatic safety limits."
                  exit 1

            - name: Run AI translation
              if: steps.preflight.outputs.needs_translation == 'true'
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  if [[ "$DRY_RUN" != "true" && -z "$OPENAI_API_KEY" ]]; then
                    echo "::error::OPENAI_API_KEY is required for a paid translation run."
                    exit 1
                  fi

                  block_automation() {
                    local reason="$1"
                    gh label create "$BLOCKER_LABEL" \
                      --color B60205 \
                      --description "Automatic translations are paused pending review" \
                      --force
                    existing_issue=$(gh issue list --state open --label "$BLOCKER_LABEL" --json number --jq '.[0].number // empty')
                    if [[ -n "$existing_issue" ]]; then
                      gh issue comment "$existing_issue" --body "$reason"
                    else
                      gh issue create \
                        --title "Translation automation paused after a paid run" \
                        --label "$BLOCKER_LABEL" \
                        --body "$reason Close this issue only after the failure is understood; the next develop change will then resume automation."
                    fi
                  }

                  ARGS=(
                    --pot-file-path "languages/$PLUGIN_SLUG.pot"
                    --output-dir languages/
                    --po-file-prefix "$PLUGIN_SLUG-"
                    --locale-format wp_locale
                    --target-languages "${{ steps.scope.outputs.target_languages }}"
                    --max-cost "${{ steps.scope.outputs.max_paid_cost }}"
                    --model "$PAID_MODEL"
                    --max-strings-per-job "${{ steps.scope.outputs.max_strings_per_job }}"
                  )

                  if [[ "$DRY_RUN" == "true" ]]; then
                    ARGS+=( --dry-run )
                  fi

                  set +e
                  timeout --signal=TERM --kill-after=30s 25m \
                    pnpm dlx "potomatic@$POTOMATIC_VERSION" "${ARGS[@]}"
                  TRANSLATION_EXIT=$?
                  set -e

                  if [[ "$TRANSLATION_EXIT" -ne 0 ]]; then
                    if [[ "$DRY_RUN" != "true" ]]; then
                      block_automation "Potomatic exited with status $TRANSLATION_EXIT during run $GITHUB_RUN_ID. Partial catalogs are attached to the failed workflow run."
                    fi
                    exit "$TRANSLATION_EXIT"
                  fi

            - name: Measure paid translation progress
              id: postflight
              if: steps.preflight.outputs.needs_translation == 'true' && (github.event_name == 'push' || inputs.dry_run != true)
              run: |
                  bash bin/prepare-translation-catalogs.sh \
                    languages \
                    "${{ steps.scope.outputs.max_missing_per_language }}" \
                    "$MAX_TOTAL_MISSING" \
                    "${{ steps.scope.outputs.expected_language_count }}" \
                    "${{ steps.scope.outputs.expected_catalog_locales }}"

            - name: Enforce paid translation completion
              if: steps.preflight.outputs.needs_translation == 'true' && (github.event_name == 'push' || inputs.dry_run != true) && (steps.postflight.outputs.total_missing != '0' || steps.postflight.outputs.within_limits != 'true')
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  AFTER_TOTAL="${{ steps.postflight.outputs.total_missing }}"
                  BEFORE_TOTAL="${{ steps.preflight.outputs.total_missing }}"

                  gh label create "$BLOCKER_LABEL" \
                    --color B60205 \
                    --description "Automatic translations are paused pending review" \
                    --force
                  gh issue create \
                    --title "Translation automation paused: paid run was incomplete" \
                    --label "$BLOCKER_LABEL" \
                    --body "Run $GITHUB_RUN_ID reduced the missing translation count from $BEFORE_TOTAL to $AFTER_TOTAL but did not complete all catalogs. Partial catalogs are attached to the failed workflow run. Close this issue only after the failure is understood."
                  echo "::error::Paid translation left $AFTER_TOTAL missing units."
                  exit 1

            - name: Generate runtime translations
              if: steps.preflight.outputs.needs_translation == 'true' && (github.event_name == 'push' || inputs.dry_run != true)
              run: |
                  wp i18n make-mo languages/
                  wp i18n make-json languages/ --no-purge

            - name: Validate translation catalogs
              if: steps.preflight.outputs.needs_translation == 'true' && (github.event_name == 'push' || inputs.dry_run != true)
              run: bash bin/verify-translation-catalogs.sh languages "${{ steps.scope.outputs.expected_language_count }}" "${{ steps.scope.outputs.expected_catalog_locales }}"

            - name: Open consolidated translation pull request
              if: steps.preflight.outputs.needs_translation == 'true' && (github.event_name == 'push' || inputs.dry_run != true)
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  set -euo pipefail

                  if [[ -z "$(git status --porcelain -- languages/)" ]]; then
                    echo "No catalog changes remain after translation."
                    exit 0
                  fi

                  git config --local user.email "github-actions[bot]@users.noreply.github.com"
                  git config --local user.name "github-actions[bot]"
                  git fetch origin "$AUTOMATION_BRANCH:refs/remotes/origin/$AUTOMATION_BRANCH" || true
                  git switch -C "$AUTOMATION_BRANCH"
                  git add languages/
                  git commit -m "chore(i18n): update translations from develop"
                  git push --force-with-lease="$AUTOMATION_BRANCH" --set-upstream origin "$AUTOMATION_BRANCH"
                  gh pr create \
                    --base "$TRANSLATION_BASE_BRANCH" \
                    --head "$AUTOMATION_BRANCH" \
                    --title "chore(i18n): update translations from develop" \
                    --body "Automatic translation update for the latest develop branch. Review language quality before merging."

            - name: Preserve failed translation catalogs
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: failed-translation-catalogs-${{ github.run_id }}
                  path: languages/
                  retention-days: 7
