name: CI - Code Quality

on:
  pull_request:
  workflow_dispatch:

env:
  WP_VERSION: 6.1.1
  PLUGIN_CHECK_VERSION: 2.0.0

# Cancels all previous workflow runs for the same branch that have not yet completed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Change Detection - Fast first step to gate expensive jobs
  # ============================================================================
  #
  # tj-actions/changed-files OUTPUT NAMING:
  # ─────────────────────────────────────────────────────────────────────────────
  # This job uses `files_yaml:` to define multiple file categories.
  # With files_yaml, outputs are prefixed with the category name:
  #   - php_any_changed, js_any_changed, css_any_changed, etc.
  #
  # Individual jobs below use `files:` (single category) which outputs:
  #   - any_changed (no prefix)
  #
  # Both patterns are correct for their respective configurations.
  # ─────────────────────────────────────────────────────────────────────────────
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' }}
    # NOTE: With files_yaml:, outputs are {category}_any_changed
    outputs:
      php: ${{ steps.changes.outputs.php_any_changed }}
      js: ${{ steps.changes.outputs.js_any_changed }}           # All JS/TS (for ESLint)
      js_src: ${{ steps.changes.outputs.js_src_any_changed }}   # All source JS/TS (for build)
      ts_src: ${{ steps.changes.outputs.ts_src_any_changed }}   # TypeScript only (for tsc)
      css: ${{ steps.changes.outputs.css_any_changed }}
      npm_deps: ${{ steps.changes.outputs.npm_deps_any_changed }}
      php_deps: ${{ steps.changes.outputs.php_deps_any_changed }}
      translation_workflow: ${{ steps.changes.outputs.translation_workflow_any_changed }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect file changes
        id: changes
        uses: tj-actions/changed-files@v45
        with:
          # files_yaml: defines multiple categories → outputs are {category}_any_changed
          files_yaml: |
            php:
              - '**/*.php'
              - '!vendor/**'
              - '!vendor-prefixed/**'
            js:
              # All JS/TS for ESLint (config, tooling, source, etc.)
              - '**/*.js'
              - '**/*.ts'
              - '**/*.tsx'
              - '**/*.jsx'
              - '!node_modules/**'
              - '!dist/**'
              - '!build/**'
              - '!vendor/**'
            js_src:
              # All source JS/TS files (for build validation)
              - 'packages/**/src/**/*.ts'
              - 'packages/**/src/**/*.tsx'
              - 'packages/**/src/**/*.js'
              - 'assets/js/src/**/*.js'
            ts_src:
              # TypeScript only (for tsc type checking)
              - 'packages/**/src/**/*.ts'
              - 'packages/**/src/**/*.tsx'
            css:
              # Only source CSS/SCSS (not built output)
              - 'assets/css/src/**/*.css'
              - 'assets/css/src/**/*.scss'
              - 'packages/**/src/**/*.css'
              - 'packages/**/src/**/*.scss'
            npm_deps:
              - 'package.json'
              - 'packages/**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
            php_deps:
              - 'composer.json'
              - 'composer.lock'
            translation_workflow:
              - '.github/workflows/translate.yml'
              - '.gitattributes'
              - 'bin/verify-translation-guardrails.js'
              - 'bin/verify-translation-catalogs.sh'
              - 'languages/**'

  translation-guardrails:
    name: Translation Spend Guardrails
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-changes.outputs.translation_workflow == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Verify translation spend guardrails
        run: node bin/verify-translation-guardrails.js

      - name: Verify translation catalogs
        run: bash bin/verify-translation-catalogs.sh

  # ============================================================================
  # PHP Code Quality - PHPCS & PHPStan
  # ============================================================================
  php-quality:
    name: PHP ${{ matrix.php-version }} - Code Quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-changes.outputs.php == 'true' }}

    strategy:
      fail-fast: false
      matrix:
        # PHPCS only on 8.2 - PHPUnit dev dep uses PHP 8+ syntax in vendor autoload
        # Code compatibility is the same regardless of PHP version running PHPCS
        php-version: ['8.2']

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # NOTE: Using `files:` (not files_yaml) → outputs are just `any_changed`
      - name: Get changed PHP files
        id: changed-files
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.php
          files_ignore: |
            vendor/**
            vendor-prefixed/**
            tests/**
            node_modules/**

      - name: Setup cache extensions
        if: steps.changed-files.outputs.any_changed == 'true'
        id: extcache
        uses: shivammathur/cache-extensions@v1
        with:
          php-version: ${{ matrix.php-version }}
          extensions: 'curl, zip'
          key: php-${{ matrix.php-version }}-ext

      - name: Cache extensions
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: actions/cache@v5
        with:
          path: ${{ steps.extcache.outputs.dir }}
          key: ${{ steps.extcache.outputs.key }}
          restore-keys: ${{ steps.extcache.outputs.key }}

      - name: Setup PHP
        if: steps.changed-files.outputs.any_changed == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, zip
          tools: composer, cs2pr, phpcs
          coverage: none

      - name: Install composer dependencies
        if: steps.changed-files.outputs.any_changed == 'true'
        run: composer install --no-interaction --optimize-autoloader --ignore-platform-reqs

      - name: Run PHPCS on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        id: phpcs
        continue-on-error: true
        run: |
          echo "${{ steps.changed-files.outputs.all_changed_files }}" | tr ' ' '\n' > .changed-files.txt
          # --warning-severity=0: Only fail on errors, not warnings (warnings still shown)
          vendor/bin/phpcs --standard=.phpcs.xml.dist --warning-severity=0 --report-full --report-checkstyle=./phpcs-report.xml --file-list=.changed-files.txt

      - name: Show PHPCS results in PR
        if: steps.changed-files.outputs.any_changed == 'true' && always() && steps.phpcs.outcome == 'failure'
        run: cs2pr ./phpcs-report.xml

      - name: Run PHPStan
        if: steps.changed-files.outputs.any_changed == 'true' && matrix.php-version == '8.2'
        continue-on-error: true
        run: vendor/bin/phpstan analyse --error-format=github

      - name: Check for PHPCS failures
        if: steps.changed-files.outputs.any_changed == 'true' && steps.phpcs.outcome == 'failure'
        run: exit 1

  # ============================================================================
  # JavaScript/TypeScript Code Quality
  # ============================================================================
  js-quality:
    name: JS/TS Code Quality
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ github.event_name == 'pull_request' && (needs.detect-changes.outputs.js == 'true' || needs.detect-changes.outputs.css == 'true') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # NOTE: Using `files:` (not files_yaml) → outputs are just `any_changed`
      # All JS/TS files for ESLint (config, tooling, source, etc.)
      - name: Get changed JS/TS files
        id: changed-js
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.js
            **/*.ts
            **/*.tsx
            **/*.jsx
          files_ignore: |
            node_modules/**
            vendor/**
            dist/**
            build/**
            coverage/**

      # NOTE: Using `files:` (not files_yaml) → outputs are just `any_changed`
      - name: Get changed CSS/SCSS files
        id: changed-css
        uses: tj-actions/changed-files@v45
        with:
          files: |
            **/*.css
            **/*.scss
          files_ignore: |
            node_modules/**
            vendor/**
            dist/**
            build/**

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Enable ESLint problem matcher
        if: steps.changed-js.outputs.any_changed == 'true'
        run: |
          MATCHER="node_modules/@wordpress/scripts/config/.eslintrc-problem-matcher.json"
          [ -f "$MATCHER" ] && echo "::add-matcher::$MATCHER" || echo "ESLint problem matcher not found, skipping"

      - name: Run ESLint on changed files
        if: steps.changed-js.outputs.any_changed == 'true'
        continue-on-error: true
        id: eslint
        run: |
          echo "${{ steps.changed-js.outputs.all_changed_files }}" | xargs -r npm run lint:js:changed --

      - name: Run Stylelint on changed files
        if: steps.changed-css.outputs.any_changed == 'true'
        continue-on-error: true
        id: stylelint
        run: |
          echo "${{ steps.changed-css.outputs.all_changed_files }}" | xargs -r npm run lint:style -- --formatter=github

      # Only type-check when TypeScript files change
      - name: Enable tsc problem matcher
        if: needs.detect-changes.outputs.ts_src == 'true'
        run: |
          MATCHER="node_modules/typescript/lib/tsc-problem-matcher.json"
          [ -f "$MATCHER" ] && echo "::add-matcher::$MATCHER" || echo "tsc problem matcher not found, skipping"

      - name: Run TypeScript type checking
        if: needs.detect-changes.outputs.ts_src == 'true'
        continue-on-error: true
        id: tsc
        run: pnpm run build:tsc

      - name: Check for linting failures
        if: steps.eslint.outcome == 'failure' || steps.stylelint.outcome == 'failure' || steps.tsc.outcome == 'failure'
        run: |
          echo "❌ Code quality checks failed:"
          [[ "${{ steps.eslint.outcome }}" == "failure" ]] && echo "  - ESLint found issues"
          [[ "${{ steps.stylelint.outcome }}" == "failure" ]] && echo "  - Stylelint found issues"
          [[ "${{ steps.tsc.outcome }}" == "failure" ]] && echo "  - TypeScript type errors"
          exit 1

  # ============================================================================
  # Build Validation
  # ============================================================================
  build-validation:
    name: Build Validation
    runs-on: ubuntu-latest
    needs: detect-changes
    # Only build when source files change (not config/tooling JS)
    if: ${{ github.event_name == 'pull_request' && (needs.detect-changes.outputs.js_src == 'true' || needs.detect-changes.outputs.npm_deps == 'true') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache webpack build artifacts
        uses: actions/cache@v4
        with:
          path: |
            .webpack-cache
            .webpack-cache-legacy
          key: webpack-cache-${{ runner.os }}-${{ hashFiles('webpack.config.js', 'webpack.old.config.js', 'pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            webpack-cache-${{ runner.os }}-${{ hashFiles('webpack.config.js', 'webpack.old.config.js', 'pnpm-lock.yaml') }}-
            webpack-cache-${{ runner.os }}-

      - name: Validate dependency tree
        continue-on-error: true
        id: dep-tree
        run: pnpm run validate:dep-tree

      - name: Build project
        id: build
        run: pnpm run build

      - name: Check for build failures
        if: steps.build.outcome == 'failure'
        run: |
          echo "❌ Build failed - webpack compilation errors detected"
          exit 1

      - name: Report dependency tree issues
        if: steps.dep-tree.outcome == 'failure'
        run: |
          echo "⚠️ Dependency tree validation found issues"
          echo "Run 'npm run validate:dep-tree:fix' locally to resolve"

  # ============================================================================
  # WordPress Plugin Check - New errors only
  # ============================================================================
  # Plugin Check scans the assembled plugin, while the delta gate compares its
  # results with the approved legacy baseline. Existing debt stays out of PR
  # annotations; only a new finding or increased occurrence count fails CI.
  plugin-check:
    name: WordPress Plugin Check Delta
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ always() && (needs.detect-changes.result == 'success' || needs.detect-changes.result == 'skipped') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          tools: composer:v2
          coverage: none

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: |
          composer config --global --unset github-oauth.github.com || true
          composer install --no-dev --optimize-autoloader --no-interaction --no-progress
          pnpm install --frozen-lockfile

      - name: Assemble release plugin
        run: |
          pnpm run build:production
          node bin/build-release.js --skip-composer --skip-npm --keep-build

      - name: Load target-branch baseline
        id: baseline
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          previous_baseline=""
          if [ -n "$BASE_SHA" ] && git cat-file -e "$BASE_SHA:.github/plugin-check-baseline.json" 2>/dev/null; then
            previous_baseline="$RUNNER_TEMP/plugin-check-base-baseline.json"
            git show "$BASE_SHA:.github/plugin-check-baseline.json" > "$previous_baseline"
          fi
          echo "previous=$previous_baseline" >> "$GITHUB_OUTPUT"

      - name: Configure Plugin Check environment
        run: |
          jq -n --arg plugin "$GITHUB_WORKSPACE/popup-maker" '{
            core: null,
            port: 8888,
            mappings: {"wp-content/plugins/popup-maker": $plugin}
          }' > .wp-env.override.json

      - name: Start WordPress and install Plugin Check
        run: |
          pnpm dlx @wordpress/env@10.39.0 start --update
          pnpm dlx @wordpress/env@10.39.0 run cli -- wp plugin install plugin-check --version="$PLUGIN_CHECK_VERSION" --activate --force

      - name: Scan assembled plugin
        run: |
          pnpm dlx @wordpress/env@10.39.0 run cli -- wp plugin check popup-maker \
            --exclude-checks=plugin_review_phpcs \
            --ignore-warnings \
            --exclude-directories=vendor-prefixed \
            --format=strict-json \
            --fields=file,line,column,type,code,message,docs \
            --slug=popup-maker > "$RUNNER_TEMP/plugin-check-results.txt" 2>&1

      - name: Fail on new Plugin Check errors
        env:
          PREVIOUS_BASELINE: ${{ steps.baseline.outputs.previous }}
        run: |
          args=(
            --results "$RUNNER_TEMP/plugin-check-results.txt"
            --baseline .github/plugin-check-baseline.json
          )
          if [ -n "$PREVIOUS_BASELINE" ]; then
            args+=(--previous-baseline "$PREVIOUS_BASELINE")
          fi
          node bin/check-plugin-check-delta.js "${args[@]}"

      - name: Stop Plugin Check environment
        if: always()
        run: pnpm dlx @wordpress/env@10.39.0 stop || true

  # ============================================================================
  # Security Scanning - NPM Dependencies
  # ============================================================================
  npm-security:
    name: pnpm Security Audit
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-changes.outputs.npm_deps == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install pnpm dependencies
        run: pnpm install --frozen-lockfile

      - name: Run pnpm audit
        continue-on-error: true
        run: pnpm audit --audit-level=high || echo "⚠️ pnpm audit found vulnerabilities"

  # ============================================================================
  # Security Scanning - Composer Dependencies
  # ============================================================================
  php-security:
    name: Composer Security Audit
    runs-on: ubuntu-latest
    needs: detect-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-changes.outputs.php_deps == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install composer dependencies
        run: composer install --no-interaction --ignore-platform-reqs

      - name: Run composer audit
        continue-on-error: true
        run: composer audit || echo "⚠️ Composer audit found vulnerabilities"

  # ============================================================================
  # PHPUnit Tests (DISABLED - Enable when test suite is comprehensive)
  # ============================================================================
  phpunit:
    name: PHPUnit - PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    if: false # Disabled until test suite is more comprehensive

    strategy:
      fail-fast: false
      matrix:
        php-version: ['7.4', '8.0', '8.1', '8.2']

    services:
      mysql:
        image: mysql:5.7
        env:
          MYSQL_ROOT_PASSWORD: password
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, mysql, zip
          coverage: xdebug

      - name: Install composer dependencies
        run: composer install --prefer-dist --no-progress --ignore-platform-reqs

      - name: Install WordPress test environment
        run: bash bin/install-wp-tests.sh wordpress_test root 'password' mysql

      - name: Run PHPUnit tests
        run: composer tests

  # ============================================================================
  # CI Summary - Rollup gate for branch protection
  # ============================================================================
  # Aggregates all CI jobs so branch protection only needs to require this one
  # context. A required job that gets skipped (e.g. no JS changes → js-quality
  # skipped) would otherwise block merges; this job treats skipped-due-to-scope
  # as pass and only fails on actual failure/cancellation.
  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs:
      [
          detect-changes,
          php-quality,
          js-quality,
          build-validation,
          npm-security,
          php-security,
          plugin-check,
      ]
    if: always()
    steps:
      - name: Check CI results
        env:
          DETECT_RESULT: ${{ needs.detect-changes.result }}
          PHP_QUALITY_RESULT: ${{ needs.php-quality.result }}
          JS_QUALITY_RESULT: ${{ needs.js-quality.result }}
          BUILD_RESULT: ${{ needs.build-validation.result }}
          NPM_SEC_RESULT: ${{ needs.npm-security.result }}
          PHP_SEC_RESULT: ${{ needs.php-security.result }}
          PLUGIN_CHECK_RESULT: ${{ needs.plugin-check.result }}
        run: |
          echo "=== CI Results Summary ==="
          echo ""

          failed=0
          check_result() {
            local name=$1
            local result=$2

            case "$result" in
              success)   echo "$name: PASSED" ;;
              skipped)   echo "$name: SKIPPED (no relevant changes)" ;;
              failure)   echo "$name: FAILED"; failed=1 ;;
              cancelled) echo "$name: CANCELLED"; failed=1 ;;
              *)         echo "$name: $result"; failed=1 ;;
            esac
          }

          # If change detection didn't succeed, downstream jobs skip and would
          # look like passes — fail the gate on anything but success/skipped.
          case "$DETECT_RESULT" in
            success)          echo "Change Detection: PASSED" ;;
            skipped)          echo "Change Detection: SKIPPED (non-PR event)" ;;
            failure|cancelled) echo "Change Detection: $DETECT_RESULT"; failed=1 ;;
            *)                echo "Change Detection: $DETECT_RESULT"; failed=1 ;;
          esac

          check_result "PHP Code Quality" "$PHP_QUALITY_RESULT"
          check_result "JS/TS Code Quality" "$JS_QUALITY_RESULT"
          check_result "Build Validation" "$BUILD_RESULT"
          check_result "pnpm Security Audit" "$NPM_SEC_RESULT"
          check_result "Composer Security Audit" "$PHP_SEC_RESULT"
          check_result "WordPress Plugin Check Delta" "$PLUGIN_CHECK_RESULT"

          echo ""
          if [ "$failed" -eq 1 ]; then
            echo "❌ CI Summary: one or more required checks failed."
            exit 1
          fi
          echo "✅ CI Summary: all checks passed or skipped."
