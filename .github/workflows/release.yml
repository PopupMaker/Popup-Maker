name: Publish approved release PR

on:
    pull_request_target:
        branches: [master]
        types: [closed]
    repository_dispatch:
        types: [retry_approved_release_pr]

permissions:
    contents: read
    pull-requests: read

concurrency:
    group: popup-maker-publication
    cancel-in-progress: false

env:
    PLUGIN_SLUG: popup-maker
    PLUGIN_NAME: Popup Maker
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    authorize:
        name: Authorize approved release PR
        if: >-
            github.event_name == 'repository_dispatch' ||
            (github.event.pull_request.merged == true &&
             startsWith(github.event.pull_request.head.ref, 'release/'))
        runs-on: ubuntu-latest
        outputs:
            merge_sha: ${{ steps.authorize.outputs.merge_sha }}
            base_sha: ${{ steps.authorize.outputs.base_sha }}
            pull_request_number: ${{ steps.authorize.outputs.pull_request_number }}
            version: ${{ steps.authorize.outputs.version }}

        steps:
            - name: Verify merged PR, approval, branch, and tag
              id: authorize
              uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
              env:
                  RETRY_PULL_REQUEST_NUMBER: ${{ github.event.client_payload.pull_request_number }}
              with:
                  script: |
                      const owner = context.repo.owner;
                      const repo = context.repo.repo;
                      const number = context.eventName === 'repository_dispatch'
                        ? Number(process.env.RETRY_PULL_REQUEST_NUMBER)
                        : context.payload.pull_request.number;
                      if (!Number.isSafeInteger(number) || number < 1) {
                        core.setFailed('A valid merged release PR number is required.');
                        return;
                      }
                      const { data: pull } = await github.rest.pulls.get({ owner, repo, pull_number: number });

                      if (!pull.merged || pull.base.ref !== 'master') {
                        core.setFailed('The release PR must be merged into master.');
                        return;
                      }
                      if (pull.head.repo?.full_name !== `${owner}/${repo}`) {
                        core.setFailed('Release PRs must come from this repository.');
                        return;
                      }

                      const branchMatch = pull.head.ref.match(/^release\/(\d+\.\d+\.\d+)$/);
                      if (!branchMatch) {
                        core.setFailed('The merged branch must be named release/X.Y.Z.');
                        return;
                      }

                      const reviews = await github.paginate(github.rest.pulls.listReviews, {
                        owner,
                        repo,
                        pull_number: number,
                        per_page: 100,
                      });
                      const latestByReviewer = new Map();
                      for (const review of reviews) {
                        if (
                          review.user?.login &&
                          ['APPROVED', 'CHANGES_REQUESTED', 'DISMISSED'].includes(review.state)
                        ) {
                          latestByReviewer.set(review.user.login, review.state);
                        }
                      }
                      const approvedReviewers = [...latestByReviewer.entries()]
                        .filter(([, state]) => state === 'APPROVED')
                        .map(([login]) => login);
                      let authorizedApproval = false;
                      for (const username of approvedReviewers) {
                        const { data: permission } = await github.rest.repos.getCollaboratorPermissionLevel({
                          owner,
                          repo,
                          username,
                        });
                        if (['admin', 'maintain', 'write'].includes(permission.permission)) {
                          authorizedApproval = true;
                          break;
                        }
                      }
                      if (!authorizedApproval && pull.merged_by?.login) {
                        const { data: mergerPermission } = await github.rest.repos.getCollaboratorPermissionLevel({
                          owner,
                          repo,
                          username: pull.merged_by.login,
                        });
                        authorizedApproval = ['admin', 'maintain', 'write'].includes(
                          mergerPermission.permission
                        );
                      }
                      if (!authorizedApproval) {
                        core.setFailed('The release PR was not approved or merged by an authorized maintainer.');
                        return;
                      }

                      const version = branchMatch[1];
                      const { data: masterBranch } = await github.rest.repos.getBranch({
                        owner,
                        repo,
                        branch: 'master',
                      });
                      if (masterBranch.commit.sha !== pull.merge_commit_sha) {
                        core.setFailed(
                          `Release ${version} is stale; master has changed since PR #${number} merged.`
                        );
                        return;
                      }

                      const { data: masterPackageFile } = await github.rest.repos.getContent({
                        owner,
                        repo,
                        path: 'package.json',
                        ref: 'master',
                      });
                      if (Array.isArray(masterPackageFile) || masterPackageFile.type !== 'file') {
                        core.setFailed('Could not read package.json from master.');
                        return;
                      }
                      const masterPackage = JSON.parse(
                        Buffer.from(masterPackageFile.content, 'base64').toString('utf8')
                      );
                      if (masterPackage.version !== version) {
                        core.setFailed(
                          `Release ${version} is stale; master currently declares ${masterPackage.version}.`
                        );
                        return;
                      }

                      let existingTagCommit = '';
                      try {
                        const { data: ref } = await github.rest.git.getRef({
                          owner,
                          repo,
                          ref: `tags/${version}`,
                        });
                        existingTagCommit = ref.object.sha;
                        if (ref.object.type === 'tag') {
                          const { data: tag } = await github.rest.git.getTag({
                            owner,
                            repo,
                            tag_sha: ref.object.sha,
                          });
                          existingTagCommit = tag.object.sha;
                        }
                      } catch (error) {
                        if (error.status !== 404) throw error;
                      }
                      if (existingTagCommit && existingTagCommit !== pull.merge_commit_sha) {
                        core.setFailed(`Tag ${version} already points to another commit.`);
                        return;
                      }

                      core.setOutput('merge_sha', pull.merge_commit_sha);
                      core.setOutput('base_sha', pull.base.sha);
                      core.setOutput('pull_request_number', String(number));
                      core.setOutput('version', version);

    build:
        name: Build canonical release package
        needs: authorize
        runs-on: ubuntu-latest
        outputs:
            zip_name: ${{ steps.package.outputs.name }}
            changelog_content: ${{ steps.changelog.outputs.content }}

        steps:
            - name: Checkout approved merge
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ needs.authorize.outputs.merge_sha }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Reject symlinked publication files
              run: |
                  if [ -L readme.txt ] ||
                    [ -L .wordpress-org ] ||
                    { [ -d .wordpress-org ] && find .wordpress-org -type l -print -quit | grep -q .; }; then
                    echo 'Symlinks are not allowed in publication files.'
                    exit 1
                  fi

            - name: Validate release version
              env:
                  BASE_SHA: ${{ needs.authorize.outputs.base_sha }}
                  VERSION: ${{ needs.authorize.outputs.version }}
              run: |
                  PREVIOUS_VERSION=$(git show "${BASE_SHA}:package.json" | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version")
                  node bin/validate-release-version.js \
                    --version "${VERSION}" \
                    --previous-version "${PREVIOUS_VERSION}"

            - name: Extract changelog
              id: changelog
              env:
                  VERSION: ${{ needs.authorize.outputs.version }}
              run: |
                  CHANGELOG=$(node bin/extract-changelog.js "${VERSION}")
                  if [ -z "${CHANGELOG}" ]; then
                    echo "No changelog content found for ${VERSION}."
                    exit 1
                  fi
                  {
                    echo 'content<<EOF'
                    echo "${CHANGELOG}"
                    echo 'EOF'
                  } >> "${GITHUB_OUTPUT}"

            - name: Set up PHP
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '8.0'
                  tools: composer:v2
                  coverage: none

            - name: Set up pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

            - name: Set up Node.js
              uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: '24'
                  cache: pnpm

            - name: Install dependencies
              run: |
                  composer config --global --unset github-oauth.github.com || true
                  composer install --no-dev --optimize-autoloader --no-interaction --no-progress
                  pnpm install --frozen-lockfile

            - name: Build production assets
              run: pnpm run build:production

            - name: Create and verify release package
              id: package
              env:
                  VERSION: ${{ needs.authorize.outputs.version }}
              run: |
                  ZIP_NAME="${PLUGIN_SLUG}_${VERSION}.zip"
                  node bin/build-release.js --zip-name "${ZIP_NAME}" --keep-build
                  node bin/verify-release-artifact.js "${ZIP_NAME}"
                  echo "name=${ZIP_NAME}" >> "${GITHUB_OUTPUT}"

            - name: Run WordPress Plugin Check
              uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
              with:
                  build-dir: ./popup-maker
                  slug: popup-maker
                  exclude-checks: plugin_review_phpcs
                  exclude-directories: vendor-prefixed
                  exclude-files: |
                      classes/Extension/Updater.php
                      includes/legacy/deprecated-classes.php
                  ignore-codes: |
                      WordPress.WP.I18n.MissingArgDomain
                      missing_direct_file_access_protection
                  ignore-warnings: true

            - name: Upload canonical release package
              uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
              with:
                  name: ${{ env.PLUGIN_SLUG }}-${{ needs.authorize.outputs.version }}
                  path: ${{ steps.package.outputs.name }}
                  retention-days: 30

    github-release:
        name: Create GitHub tag and release
        needs: [authorize, build]
        runs-on: ubuntu-latest
        permissions:
            contents: write
        outputs:
            release_id: ${{ steps.release.outputs.id }}
            release_url: ${{ steps.release.outputs.url }}

        steps:
            - name: Download canonical release package
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: ${{ env.PLUGIN_SLUG }}-${{ needs.authorize.outputs.version }}

            - name: Create or verify release
              id: release
              uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
              with:
                  tag_name: ${{ needs.authorize.outputs.version }}
                  target_commitish: ${{ needs.authorize.outputs.merge_sha }}
                  name: ${{ env.PLUGIN_NAME }} ${{ needs.authorize.outputs.version }}
                  body: ${{ needs.build.outputs.changelog_content }}
                  files: ${{ needs.build.outputs.zip_name }}
                  draft: false
                  prerelease: false
                  make_latest: true

    wordpress-org:
        name: Deploy canonical package to WordPress.org
        needs: [authorize, build, github-release]
        runs-on: ubuntu-latest
        env:
            BUILD_DIR: ${{ github.workspace }}/.wordpress-org-build/popup-maker

        steps:
            - name: Checkout approved merge
              uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ needs.authorize.outputs.merge_sha }}
                  persist-credentials: false

            - name: Download canonical release package
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: ${{ env.PLUGIN_SLUG }}-${{ needs.authorize.outputs.version }}

            - name: Verify and extract canonical release package
              env:
                  ZIP_NAME: ${{ needs.build.outputs.zip_name }}
              run: |
                  node bin/verify-release-artifact.js "${ZIP_NAME}"
                  mkdir -p "$(dirname "${BUILD_DIR}")"
                  unzip -o "${ZIP_NAME}" -d "$(dirname "${BUILD_DIR}")"
                  test -f "${BUILD_DIR}/popup-maker.php"

            - name: Run WordPress Plugin Check
              uses: wordpress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1
              with:
                  build-dir: ${{ env.BUILD_DIR }}
                  slug: popup-maker
                  exclude-checks: plugin_review_phpcs
                  exclude-directories: vendor-prefixed
                  exclude-files: |
                      classes/Extension/Updater.php
                      includes/legacy/deprecated-classes.php
                  ignore-codes: |
                      WordPress.WP.I18n.MissingArgDomain
                      missing_direct_file_access_protection
                  ignore-warnings: true

            - name: Reject symlinked deployment files
              run: |
                  if [ -L .wordpress-org ] ||
                    { [ -d .wordpress-org ] && find .wordpress-org -type l -print -quit | grep -q .; } ||
                    [ -L "${BUILD_DIR}" ] ||
                    { [ -d "${BUILD_DIR}" ] && find "${BUILD_DIR}" -type l -print -quit | grep -q .; }; then
                    echo 'Symlinks are not allowed in deployment files.'
                    exit 1
                  fi

            - name: Deploy to WordPress.org
              uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # stable
              env:
                  SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
                  SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
                  SLUG: ${{ env.PLUGIN_SLUG }}
                  VERSION: ${{ needs.authorize.outputs.version }}
                  BUILD_DIR: ${{ env.BUILD_DIR }}
                  ASSETS_DIR: .wordpress-org

    edd-webhook:
        name: Notify EDD Store
        needs: [authorize, build, github-release]
        runs-on: ubuntu-latest

        steps:
            - name: Resolve release asset
              id: asset
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PACKAGE_NAME: ${{ needs.build.outputs.zip_name }}
                  RELEASE_ID: ${{ needs.github-release.outputs.release_id }}
                  REPO: ${{ github.repository }}
              run: |
                  ASSET_URL=$(gh api "repos/${REPO}/releases/${RELEASE_ID}" \
                    --jq ".assets[] | select(.name == \"${PACKAGE_NAME}\") | .url")
                  test -n "${ASSET_URL}"
                  echo "asset_url=${ASSET_URL}" >> "${GITHUB_OUTPUT}"

            - name: Sync release to EDD
              uses: code-atlantic/edd-release-sync@33d9c1b6afba496eb16992fd0661c291ad0565f9 # v0.2.0
              with:
                  edd_id: ${{ vars.EDD_PRODUCT_ID }}
                  version: ${{ needs.authorize.outputs.version }}
                  release_url: ${{ needs.github-release.outputs.release_url }}
                  download_url: https://github.com/${{ github.repository }}/releases/download/${{ needs.authorize.outputs.version }}/${{ needs.build.outputs.zip_name }}
                  asset_api_url: ${{ steps.asset.outputs.asset_url }}
                  webhook_url: ${{ vars.EDD_WEBHOOK_URL }}
                  webhook_token: ${{ secrets.EDD_WEBHOOK_TOKEN }}
                  plugin_slug: ${{ env.PLUGIN_SLUG }}
                  is_prerelease: false
                  test_mode: false

    google-drive-upload:
        name: Upload to Google Drive
        needs: [authorize, build, github-release]
        runs-on: ubuntu-latest
        outputs:
            download_link: ${{ steps.upload.outputs.download_link }}

        steps:
            - name: Download canonical release package
              uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
              with:
                  name: ${{ env.PLUGIN_SLUG }}-${{ needs.authorize.outputs.version }}

            - name: Upload to Google Drive
              id: upload
              uses: code-atlantic/sync-release-to-google-drive@b579fe06183c2b49a73a9de4dd25ffc158e9ba87 # v0.3.1
              with:
                  filename: ${{ needs.build.outputs.zip_name }}
                  credentials: ${{ secrets.GOOGLE_DRIVE_CREDENTIALS }}
                  folder_id: ${{ vars.GOOGLE_DRIVE_FOLDER_ID }}
                  overwrite: 'true'
                  sharing: anyone
                  link_discoverable: false

    changelog:
        name: Create review-required WordPress changelog draft
        needs: [github-release]
        uses: code-atlantic/release-changelog-action/.github/workflows/sync-release.yml@3c44b56d2677a434fc85e5610989bb194cf08571
        with:
            product-key: core
            expected-repository: PopupMaker/Popup-Maker
            release-id: ${{ format('{0}', needs.github-release.outputs.release_id) }}
        secrets:
            WORDPRESS_URL: ${{ secrets.WORDPRESS_URL }}
            WORDPRESS_ACCESS_TOKEN: ${{ secrets.WORDPRESS_ACCESS_TOKEN }}
            WORDPRESS_USERNAME: ${{ secrets.WORDPRESS_USERNAME }}
            WORDPRESS_APPLICATION_PASSWORD: ${{ secrets.WORDPRESS_APPLICATION_PASSWORD }}

    back-sync:
        name: Open and validate master back-sync PR
        needs: [authorize, github-release]
        runs-on: ubuntu-latest
        permissions:
            actions: write
            contents: write
            pull-requests: write

        steps:
            - name: Open or reuse master to develop PR
              id: back_sync
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  REPO: ${{ github.repository }}
                  VERSION: ${{ needs.authorize.outputs.version }}
              run: |
                  PR_NUMBER=$(gh pr list --repo "${REPO}" --base develop --head master --state open --json number --jq '.[0].number // ""')
                  if [ -n "${PR_NUMBER}" ]; then
                    PR_URL=$(gh pr view "${PR_NUMBER}" --repo "${REPO}" --json url --jq '.url')
                    echo "Back-sync PR already open: ${PR_URL}"
                  else
                    PR_URL=$(gh pr create \
                      --repo "${REPO}" \
                      --base develop \
                      --head master \
                      --title "Back-sync release ${VERSION} to develop" \
                      --body "Carries the approved ${VERSION} release metadata and release merge back to develop.")
                    PR_NUMBER=${PR_URL##*/}
                    echo "Back-sync PR opened: ${PR_URL}"
                  fi

                  MERGE_SHA=""
                  for _ in {1..30}; do
                    MERGE_SHA=$(gh api "repos/${REPO}/git/ref/pull/${PR_NUMBER}/merge" --jq '.object.sha' 2>/dev/null || true)
                    [ -n "${MERGE_SHA}" ] && break
                    sleep 2
                  done
                  if [ -z "${MERGE_SHA}" ]; then
                    echo "Back-sync PR #${PR_NUMBER} has no mergeable test commit."
                    exit 1
                  fi

                  VALIDATION_BRANCH="back-sync-validation/${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  cleanup() {
                    gh api --method DELETE "repos/${REPO}/git/refs/heads/${VALIDATION_BRANCH}" >/dev/null 2>&1 || true
                  }
                  trap cleanup EXIT

                  gh api --method POST "repos/${REPO}/git/refs" \
                    -f ref="refs/heads/${VALIDATION_BRANCH}" \
                    -f sha="${MERGE_SHA}" >/dev/null
                  VALIDATION_ID="back-sync-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
                  gh workflow run ci.yml \
                    --repo "${REPO}" \
                    --ref master \
                    -f back_sync=true \
                    -f checkout_ref="${MERGE_SHA}" \
                    -f validation_id="${VALIDATION_ID}"
                  gh workflow run tests.yml \
                    --repo "${REPO}" \
                    --ref "${VALIDATION_BRANCH}" \
                    -f back_sync=true

                  CI_RUN_ID=""
                  TEST_RUN_ID=""
                  for _ in {1..30}; do
                    CI_RUN_ID=$(gh run list \
                      --repo "${REPO}" \
                      --workflow ci.yml \
                      --branch master \
                      --event workflow_dispatch \
                      --limit 20 \
                      --json databaseId,displayTitle \
                      --jq ".[] | select(.displayTitle == \"CI - Code Quality (${VALIDATION_ID})\") | .databaseId" \
                      | head -n 1)
                    TEST_RUN_ID=$(gh run list \
                      --repo "${REPO}" \
                      --workflow tests.yml \
                      --branch "${VALIDATION_BRANCH}" \
                      --event workflow_dispatch \
                      --limit 1 \
                      --json databaseId \
                      --jq '.[0].databaseId // ""')
                    [ -n "${CI_RUN_ID}" ] && [ -n "${TEST_RUN_ID}" ] && break
                    sleep 2
                  done
                  if [ -z "${CI_RUN_ID}" ] || [ -z "${TEST_RUN_ID}" ]; then
                    echo 'The back-sync validation workflows did not start.'
                    exit 1
                  fi

                  echo "Waiting for back-sync CI run ${CI_RUN_ID} and test run ${TEST_RUN_ID}."
                  VALIDATION_FAILED=0
                  gh run watch "${CI_RUN_ID}" --repo "${REPO}" --exit-status || VALIDATION_FAILED=1
                  gh run watch "${TEST_RUN_ID}" --repo "${REPO}" --exit-status || VALIDATION_FAILED=1
                  if [ "${VALIDATION_FAILED}" -ne 0 ]; then
                    echo 'Back-sync validation failed.'
                    exit 1
                  fi

    slack-success:
        name: Slack success notification
        needs:
            [
                authorize,
                build,
                github-release,
                wordpress-org,
                edd-webhook,
                google-drive-upload,
                changelog,
                back-sync,
            ]
        if: >-
            always() &&
            needs.github-release.result == 'success' &&
            needs.wordpress-org.result == 'success' &&
            needs.edd-webhook.result == 'success' &&
            needs.google-drive-upload.result == 'success' &&
            needs.changelog.result == 'success' &&
            needs.back-sync.result == 'success'
        runs-on: ubuntu-latest
        steps:
            - name: Send success notification
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
                  VERSION: ${{ needs.authorize.outputs.version }}
                  RELEASE_URL: ${{ needs.github-release.outputs.release_url }}
                  DRIVE_URL: ${{ needs.google-drive-upload.outputs.download_link }}
              run: |
                  if [ -z "${SLACK_WEBHOOK_URL}" ]; then
                    exit 0
                  fi
                  PAYLOAD=$(jq -n \
                    --arg version "${VERSION}" \
                    --arg release_url "${RELEASE_URL}" \
                    --arg drive_url "${DRIVE_URL}" \
                    '{text: ("🚀 *Popup Maker " + $version + " released*\n\n✅ GitHub release\n✅ WordPress.org\n✅ EDD\n✅ Google Drive\n✅ Changelog draft\n\n<" + $release_url + "|View release>" + (if $drive_url != "" then " · <" + $drive_url + "|Download ZIP>" else "" end)), username: "Release Bot", icon_emoji: ":package:"}')
                  curl -sS --fail -X POST "${SLACK_WEBHOOK_URL}" \
                    -H 'Content-Type: application/json' \
                    -d "${PAYLOAD}"

    slack-failure:
        name: Slack failure notification
        needs:
            [
                authorize,
                build,
                github-release,
                wordpress-org,
                edd-webhook,
                google-drive-upload,
                changelog,
                back-sync,
            ]
        if: >-
            always() &&
            needs.authorize.result != 'skipped' &&
            (needs.authorize.result == 'failure' ||
             needs.build.result == 'failure' ||
             needs.github-release.result == 'failure' ||
             needs.wordpress-org.result == 'failure' ||
             needs.edd-webhook.result == 'failure' ||
             needs.google-drive-upload.result == 'failure' ||
             needs.changelog.result == 'failure' ||
             needs.back-sync.result == 'failure')
        runs-on: ubuntu-latest
        steps:
            - name: Send failure notification
              env:
                  SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK }}
                  VERSION: ${{ needs.authorize.outputs.version }}
                  RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
              run: |
                  if [ -z "${SLACK_WEBHOOK_URL}" ]; then
                    exit 0
                  fi
                  PAYLOAD=$(jq -n \
                    --arg version "${VERSION:-unknown}" \
                    --arg run_url "${RUN_URL}" \
                    '{text: ("🚨 *Popup Maker " + $version + " release needs attention*\n\n<" + $run_url + "|View failed workflow>"), username: "Release Bot", icon_emoji: ":package:"}')
                  curl -sS --fail -X POST "${SLACK_WEBHOOK_URL}" \
                    -H 'Content-Type: application/json' \
                    -d "${PAYLOAD}"

    summary:
        name: Release summary
        needs:
            [
                authorize,
                build,
                github-release,
                wordpress-org,
                edd-webhook,
                google-drive-upload,
                changelog,
                back-sync,
                slack-success,
                slack-failure,
            ]
        if: always() && needs.authorize.result != 'skipped'
        runs-on: ubuntu-latest

        steps:
            - name: Write release summary
              env:
                  VERSION: ${{ needs.authorize.outputs.version }}
                  PR_NUMBER: ${{ needs.authorize.outputs.pull_request_number }}
                  RELEASE_URL: ${{ needs.github-release.outputs.release_url }}
                  BUILD_RESULT: ${{ needs.build.result }}
                  GITHUB_RESULT: ${{ needs.github-release.result }}
                  WORDPRESS_RESULT: ${{ needs.wordpress-org.result }}
                  EDD_RESULT: ${{ needs.edd-webhook.result }}
                  DRIVE_RESULT: ${{ needs.google-drive-upload.result }}
                  CHANGELOG_RESULT: ${{ needs.changelog.result }}
                  BACK_SYNC_RESULT: ${{ needs.back-sync.result }}
              run: |
                  {
                    echo "# Popup Maker ${VERSION}"
                    echo "Approved release PR: #${PR_NUMBER}"
                    echo "Release: ${RELEASE_URL}"
                    echo ""
                    echo "| Step | Result |"
                    echo "| --- | --- |"
                    echo "| Build | ${BUILD_RESULT} |"
                    echo "| GitHub | ${GITHUB_RESULT} |"
                    echo "| WordPress.org | ${WORDPRESS_RESULT} |"
                    echo "| EDD | ${EDD_RESULT} |"
                    echo "| Google Drive | ${DRIVE_RESULT} |"
                    echo "| Changelog draft | ${CHANGELOG_RESULT} |"
                    echo "| Back-sync PR | ${BACK_SYNC_RESULT} |"
                  } >> "${GITHUB_STEP_SUMMARY}"
