name: Historical GitHub releases

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Inventory first; draft and publish modes write GitHub Releases.
        required: true
        default: inventory
        type: choice
        options:
          - inventory
          - drafts
          - publish
      include_prereleases:
        description: Also generate releases for beta and RC tags.
        required: true
        default: false
        type: boolean
      confirm_publish:
        description: Type PUBLISH HISTORICAL RELEASES only for reviewed publish runs.
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  historical-releases:
    permissions:
      contents: write
    uses: code-atlantic/release-changelog-action/.github/workflows/historical-releases.yml@ad30b912ba206081212117929d103b8e22212740
    with:
      expected-repository: PopupMaker/Popup-Maker
      mode: ${{ inputs.mode }}
      source-file-path: readme.txt
      include-prereleases: ${{ inputs.include_prereleases }}
      max-releases: 100
      confirm-publish: ${{ inputs.confirm_publish }}
