name: WordPress Plugin Check

on:
    pull_request:
    push:
        branches:
            - main
            - master
            - develop
            - 'release/**'

permissions:
    contents: read

concurrency:
    group: plugin-check-${{ github.ref }}
    cancel-in-progress: true

jobs:
    plugin-check:
        name: Check assembled plugin
        runs-on: ubuntu-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Setup PHP
              uses: shivammathur/setup-php@v2
              with:
                  php-version: '8.0'
                  tools: composer:v2
                  coverage: none

            - name: Setup pnpm
              uses: pnpm/action-setup@v4

            - name: Setup Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '20'
                  cache: pnpm

            - name: Install dependencies
              run: |
                  composer install --no-dev --optimize-autoloader --no-interaction --no-progress
                  pnpm install --frozen-lockfile

            - name: Assemble release plugin
              run: |
                  pnpm run build:production
                  node bin/build-release.js --skip-composer --skip-npm --keep-build

            - name: Run WordPress Plugin Check
              uses: wordpress/plugin-check-action@v1
              with:
                  build-dir: ./popup-maker
                  slug: popup-maker
                  exclude-checks: plugin_review_phpcs
                  exclude-directories: vendor-prefixed
                  exclude-files: |
                      classes/Extension/Updater.php
                      includes/legacy/deprecated-classes.php
                  ignore-codes: |
                      WordPress.WP.I18n.MissingArgDomain
                      missing_direct_file_access_protection
                  ignore-warnings: true
